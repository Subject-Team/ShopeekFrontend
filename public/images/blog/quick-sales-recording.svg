<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad4)" rx="16" />

  <!-- Smartphone Frame -->
  <g transform="translate(280, 50)">
    <rect width="240" height="350" rx="30" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Speaker & Camera notch -->
    <rect x="90" y="12" width="60" height="8" rx="4" fill="#334155" />
    
    <!-- Screen content -->
    <rect x="12" y="32" width="216" height="290" rx="16" fill="#1e293b" />
    
    <!-- Chat Header -->
    <rect x="12" y="32" width="216" height="40" rx="16" fill="#0369a1" />
    <circle cx="35" cy="52" r="12" fill="#38bdf8" />
    <text x="55" y="56" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">ربات ثبت فروش شاپیک</text>
    
    <!-- Incoming / Outgoing bubbles -->
    <rect x="25" y="90" width="180" height="45" rx="10" fill="#334155" />
    <text x="35" y="116" fill="#e2e8f0" font-family="sans-serif" font-size="10">ثبت فاکتور: مانتو کتی ۸۵۰هزار</text>
    
    <rect x="35" y="150" width="180" height="55" rx="10" fill="#047857" />
    <text x="45" y="174" fill="#ecfdf5" font-family="sans-serif" font-size="10" font-weight="bold">فاکتور #۱۰۲۴ با موفقیت ثبت شد</text>
    <text x="45" y="194" fill="#a7f3d0" font-family="sans-serif" font-size="9">لینک فاکتور مشتری صادر گردید</text>

    <!-- Synced icon -->
    <circle cx="120" cy="250" r="24" fill="#10b981" opacity="0.2" />
    <circle cx="120" cy="250" r="16" fill="#10b981" />
    <path d="M113 250 L118 255 L128 244" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="120" y="290" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="bold">همگام با پایگاه داده شاپیک</text>
  </g>

  <!-- Left Accent: Traditional vs Modern -->
  <g transform="translate(70, 160)">
    <circle cx="50" cy="50" r="40" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="50" y="55" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">دفتر دستی</text>
    <line x1="25" y1="25" x2="75" y2="75" stroke="#f43f5e" stroke-width="3" />
  </g>

  <!-- Right Accent: Speed -->
  <g transform="translate(620, 160)">
    <circle cx="50" cy="50" r="40" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="50" y="55" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">زیر ۱۰ ثانیه</text>
  </g>
</svg>
