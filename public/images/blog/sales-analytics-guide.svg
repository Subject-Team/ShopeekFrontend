<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad1)" rx="16" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="80" y1="100" x2="720" y2="100" />
    <line x1="80" y1="180" x2="720" y2="180" />
    <line x1="80" y1="260" x2="720" y2="260" />
    <line x1="80" y1="340" x2="720" y2="340" />
  </g>

  <!-- Area & Line Chart -->
  <path d="M120 320 Q 220 280, 320 220 T 520 160 T 680 110 L 680 340 L 120 340 Z" fill="url(#chartGrad)" />
  <path d="M120 320 Q 220 280, 320 220 T 520 160 T 680 110" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />

  <!-- Data points -->
  <circle cx="120" cy="320" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  <circle cx="320" cy="220" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  <circle cx="520" cy="160" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  <circle cx="680" cy="110" r="8" fill="#a855f7" stroke="#ffffff" stroke-width="3" />

  <!-- Bar Chart accents -->
  <rect x="200" y="260" width="28" height="80" rx="6" fill="url(#barGrad)" opacity="0.7" />
  <rect x="250" y="210" width="28" height="130" rx="6" fill="url(#barGrad)" opacity="0.8" />
  <rect x="420" y="190" width="28" height="150" rx="6" fill="url(#barGrad)" opacity="0.8" />
  <rect x="580" y="140" width="28" height="200" rx="6" fill="url(#barGrad)" opacity="0.9" />

  <!-- Floating Metric Pill -->
  <g transform="translate(480, 60)">
    <rect width="210" height="50" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="30" cy="25" r="12" fill="#10b981" />
    <path d="M25 25 L29 29 L35 20" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="54" y="31" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">+۴۲٪ رشد سود خالص</text>
  </g>
</svg>
