<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad3)" rx="16" />

  <!-- RFM 3 Pillars -->
  <g transform="translate(140, 120)">
    <!-- Card R -->
    <g transform="translate(0, 0)">
      <rect width="140" height="200" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.9" />
      <circle cx="70" cy="50" r="28" fill="#1d4ed8" />
      <text x="70" y="58" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">R</text>
      <text x="70" y="110" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="bold">تازگی خرید</text>
      <text x="70" y="140" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Recency</text>
    </g>

    <!-- Card F -->
    <g transform="translate(190, 0)">
      <rect width="140" height="200" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2" opacity="0.9" />
      <circle cx="70" cy="50" r="28" fill="url(#purpleGrad)" />
      <text x="70" y="58" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">F</text>
      <text x="70" y="110" text-anchor="middle" fill="#d8b4fe" font-family="sans-serif" font-size="16" font-weight="bold">بسامد خرید</text>
      <text x="70" y="140" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Frequency</text>
    </g>

    <!-- Card M -->
    <g transform="translate(380, 0)">
      <rect width="140" height="200" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" opacity="0.9" />
      <circle cx="70" cy="50" r="28" fill="#047857" />
      <text x="70" y="58" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">M</text>
      <text x="70" y="110" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="16" font-weight="bold">ارزش مالی</text>
      <text x="70" y="140" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Monetary</text>
    </g>
  </g>

  <!-- Bottom Customer Badges -->
  <g transform="translate(250, 360)">
    <rect width="300" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="25" cy="21" r="10" fill="#eab308" />
    <text x="160" y="26" text-anchor="middle" fill="#fef08a" font-family="sans-serif" font-size="13" font-weight="bold">شناسایی هوشمند مشتریان وفادار (CRM)</text>
  </g>
</svg>
