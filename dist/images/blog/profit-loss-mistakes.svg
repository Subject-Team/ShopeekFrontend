<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="محاسبه سود و زیان کسب و کار">
  <rect width="800" height="450" fill="#f7faf9" />

  <!-- backdrop shapes -->
  <circle cx="688" cy="66" r="96" fill="#00a388" opacity="0.09" />
  <circle cx="96" cy="386" r="72" fill="#2579ef" opacity="0.08" />
  <g fill="#cbd5e1">
    <circle cx="150" cy="90" r="4" />
    <circle cx="178" cy="90" r="4" />
    <circle cx="206" cy="90" r="4" />
    <circle cx="150" cy="116" r="4" />
    <circle cx="178" cy="116" r="4" />
    <circle cx="206" cy="116" r="4" />
  </g>
  <!-- sparkles -->
  <path d="M190 300 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="#00a388" />
  <path d="M620 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="#2579ef" />
  <path d="M690 250 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" fill="#f59e0b" />

  <!-- ground -->
  <ellipse cx="400" cy="412" rx="270" ry="16" fill="#0f172a" opacity="0.07" />

  <!-- banknotes fanning out -->
  <g>
    <g transform="translate(335, 168) rotate(-18)">
      <rect x="-55" y="-28" width="110" height="56" rx="8" fill="#00a388" />
      <rect x="-55" y="-10" width="110" height="20" fill="#ffffff" opacity="0.35" />
    </g>
    <g transform="translate(400, 160)">
      <rect x="-55" y="-28" width="110" height="56" rx="8" fill="#2579ef" />
      <rect x="-55" y="-10" width="110" height="20" fill="#ffffff" opacity="0.35" />
    </g>
    <g transform="translate(465, 168) rotate(18)">
      <rect x="-55" y="-28" width="110" height="56" rx="8" fill="#f59e0b" />
      <rect x="-55" y="-10" width="110" height="20" fill="#ffffff" opacity="0.35" />
    </g>
  </g>

  <!-- wallet -->
  <g>
    <rect x="270" y="200" width="260" height="150" rx="28" fill="#16233a" />
    <rect x="292" y="248" width="216" height="80" rx="16" fill="#00a388" />
    <circle cx="482" cy="288" r="10" fill="#16233a" />
  </g>

  <!-- one bill slipping out -->
  <g>
    <circle cx="538" cy="329" r="4" fill="#cbd5e1" />
    <circle cx="550" cy="330" r="4" fill="#cbd5e1" />
    <g transform="translate(602, 330) rotate(12)">
      <rect x="-45" y="-23" width="90" height="46" rx="7" fill="#f59e0b" />
      <rect x="-45" y="-8" width="90" height="16" fill="#ffffff" opacity="0.35" />
    </g>
  </g>
</svg>
